<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="多云管理平台 Logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f7aff" />
      <stop offset="1" stop-color="#4096ff" />
    </linearGradient>
    <radialGradient id="cloud" cx="0.4" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#e8f1ff" />
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0b3aa0" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- 背景圆角卡片 -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)" />
  <!-- 顶部柔光 -->
  <ellipse cx="92" cy="54" rx="120" ry="58" fill="#ffffff" opacity="0.10" />

  <!-- 主云（平台本体） -->
  <g filter="url(#soft)" fill="url(#cloud)">
    <circle cx="92" cy="156" r="30" />
    <circle cx="124" cy="132" r="42" />
    <circle cx="160" cy="156" r="30" />
    <rect x="84" y="154" width="84" height="34" rx="17" />
  </g>

  <!-- 次云（第二朵云，代表多云） -->
  <g fill="url(#cloud)" opacity="0.95">
    <circle cx="176" cy="92" r="16" />
    <circle cx="194" cy="80" r="22" />
    <circle cx="210" cy="92" r="16" />
    <rect x="172" y="90" width="42" height="18" rx="9" />
  </g>

  <!-- 连接线：平台统一编排多云 -->
  <path d="M126 120 Q156 92 188 92" fill="none" stroke="#ffffff" stroke-opacity="0.6"
        stroke-width="4" stroke-linecap="round" />
  <circle cx="156" cy="104" r="5" fill="#ffffff" />
</svg>
