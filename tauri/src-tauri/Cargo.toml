[package]
name = "cloud-manager-desktop"
version = "0.1.0"
description = "多云管理平台桌面客户端 (Tauri + Go 后端 sidecar)"
authors = ["Cloud Manager"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
